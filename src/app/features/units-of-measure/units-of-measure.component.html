<section class="panel">
  <div class="header">
    <h1>Units of Measure</h1>
    @if (canCreate()) {
      <button mat-flat-button color="primary" type="button" (click)="startCreate()">Add UOM</button>
    }
  </div>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [formControl]="nameFilter" placeholder="Search by name" />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="items()" class="table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        @if (canUpdate() && row.canEdit !== false) {
          <button mat-button type="button" (click)="startEdit(row)">Edit</button>
        }
        @if (canDelete() && row.canDelete !== false) {
          <button mat-button type="button" (click)="remove(row)">Delete</button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="pager">
    <span class="muted">{{ totalCount() }} total · page {{ page() }} / {{ totalPages() || 1 }}</span>
    <span class="spacer"></span>
    <button mat-stroked-button type="button" [disabled]="page() <= 1" (click)="prevPage()">Previous</button>
    <button
      mat-stroked-button
      type="button"
      [disabled]="totalPages() === 0 || page() >= totalPages()"
      (click)="nextPage()"
    >
      Next
    </button>
  </div>

  <ng-template #uomFormTemplate>
    <h2 mat-dialog-title>{{ editingId() ? 'Edit Unit' : 'Create Unit' }}</h2>
    <mat-dialog-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="form">
        <div class="grid">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>
        </div>
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-stroked-button type="button" (click)="cancelEdit()">Cancel</button>
      <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="save()">Save</button>
    </mat-dialog-actions>
  </ng-template>
</section>
