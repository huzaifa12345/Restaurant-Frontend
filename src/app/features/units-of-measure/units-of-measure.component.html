<section class="panel">
  <div class="header">
    <h1>Units of Measure</h1>
    @if (canCreate()) {
      <button mat-flat-button color="primary" type="button" (click)="startCreate()">Add UOM</button>
    }
  </div>

  <table mat-table [dataSource]="items()" class="table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        @if (canUpdate() && row.canEdit !== false) {
          <button mat-button type="button" (click)="startEdit(row)">Edit</button>
        }
        @if (canDelete() && row.canDelete !== false) {
          <button mat-button type="button" (click)="remove(row)">Delete</button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (showForm()) {
    <form [formGroup]="form" (ngSubmit)="save()" class="form">
      <h2>{{ editingId() ? 'Edit Unit' : 'Create Unit' }}</h2>
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>
      </div>
      <div class="actions">
        <button mat-stroked-button type="button" (click)="cancelEdit()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Save</button>
      </div>
    </form>
  }
</section>
